<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">FaceBlur Studio</title>
  <desc id="desc">Dark banner with the FaceBlur Studio name and a stylized blurred face.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#121316"/>
      <stop offset="1" stop-color="#242734"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#ff7358"/>
      <stop offset="1" stop-color="#e54e38"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1200" height="300" rx="26" fill="url(#background)"/>
  <rect x="42" y="40" width="220" height="220" rx="32" fill="#191c24" stroke="#363a48" stroke-width="2"/>
  <path d="M86 100V82h18 M200 82h18v18 M86 200v18h18 M200 218h18v-18" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="152" cy="145" rx="52" ry="64" fill="#ff9b83" opacity=".62" filter="url(#soft)"/>
  <path d="M119 113q34-31 67 0" fill="none" stroke="#e54e38" stroke-width="12" opacity=".55" filter="url(#soft)"/>
  <text x="306" y="137" fill="#f4f5f8" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="700">FaceBlur Studio</text>
  <text x="309" y="190" fill="#adb4c2" font-family="Arial, Helvetica, sans-serif" font-size="27">Local video face blurring</text>
  <rect x="308" y="222" width="530" height="5" rx="2.5" fill="url(#accent)"/>
</svg>
